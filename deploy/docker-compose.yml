services:
  app:
    image: zhixu-app:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment: &app_env
      # 公网关键值不再提供本地回退：缺失时 docker compose 直接拒绝启动（${VAR:?}）。
      # 应用启动时 app/config_guard.py 还会对公网模式再做一次 fail-closed 自检。
      STUDY_DOMAIN: "${STUDY_DOMAIN:-localhost}"
      STUDY_ALLOWED_HOSTS: "${STUDY_ALLOWED_HOSTS:?请设置允许的 Host（例如 zhixu.example.com，禁止 * 与本地地址）}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:?请设置可信反向代理 IP/CIDR（例如 172.16.0.0/12，禁止 *）}"
      STUDY_PUBLIC_MODE: "${STUDY_PUBLIC_MODE:?请显式设置 STUDY_PUBLIC_MODE（本地 0 / 公网 1）}"
      STUDY_REGISTRATION_MODE: "${STUDY_REGISTRATION_MODE:-}"
      STUDY_ADMIN_INIT_TOKEN: "${STUDY_ADMIN_INIT_TOKEN:-}"
      STUDY_DATA_DIR: /data
      STUDY_BANK_DIR: /bank
      # 显式声明容器部署布局：公网模式下缺失 PostgreSQL/Redis/可信反代等关键项时应用拒绝启动。
      # （非标准目录的部署也请设置该变量，否则只按 /data、/bank 标准路径推断。）
      STUDY_DEPLOYMENT_LAYOUT: "1"
      # 挂载的是题库根目录：跟随 releases/CURRENT 读取同一份快照。
      # 若要固定到某个发布包，把 HOST_BANK_DIR 指到 releases/<version> 并删掉本行。
      STUDY_BANK_FOLLOW_POINTER: "1"
      # 挂题库根目录即可：应用会自动跟随 releases/CURRENT 读取同一份快照；
      # 也可把 HOST_BANK_DIR 指到具体 releases/<version> 目录（此时 bank_source=env）。
      # 可选：声明期望的题库版本，就绪检查不一致时降级，防止挂错目录或旧进程。
      STUDY_EXPECTED_BANK_VERSION: "${STUDY_EXPECTED_BANK_VERSION:-}"
      # 可选：镜像构建号（提交号），写入 OpenAPI / 就绪信息 / 响应头。
      STUDY_BUILD_ID: "${STUDY_BUILD_ID:-}"
      # 可选：部署探针口令。携带 X-Health-Token 调用 /api/health/ready 可读到完整依赖详情；
      # 未登录且无口令时只返回精简状态（不含宿主路径/题量/Redis 细节）。
      STUDY_HEALTH_TOKEN: "${STUDY_HEALTH_TOKEN:-}"
      # Redis 强制密码认证且不再回退示例值：密码含 @ : / ? 等 URL 保留字符时，
      # 请在 REDIS_PASSWORD 里填写百分号编码后的值（例如 p%40ss），Web/Worker 与 redis
      # 服务共用该变量；缺失 REDIS_PASSWORD 时 Compose 直接拒绝启动。
      REDIS_URL: "redis://:${REDIS_PASSWORD:?请设置 REDIS_PASSWORD（禁止 changeme 等示例值）}@redis:6379/0"
      DATABASE_URL: "${DATABASE_URL:-postgresql://zhixu:${PG_PASSWORD:?请设置 PG_PASSWORD}@postgres:5432/zhixu}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_PREFIX: "${S3_PREFIX:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      COMMUNITY_EXPLANATIONS_ENABLED: "${COMMUNITY_EXPLANATIONS_ENABLED:-0}"
      STUDY_REVIEW_SCHEDULER: "${STUDY_REVIEW_SCHEDULER:-rules}"
      STUDY_EMBEDDING_BASE_URL: "${STUDY_EMBEDDING_BASE_URL:-}"
      STUDY_EMBEDDING_MODEL: "${STUDY_EMBEDDING_MODEL:-}"
      STUDY_EMBEDDING_API_KEY: "${STUDY_EMBEDDING_API_KEY:-}"
      STUDY_AI_ALLOWED_HOSTS: "${STUDY_AI_ALLOWED_HOSTS:-}"
      # AI 地址策略：留空按 STUDY_PUBLIC_MODE 自动决策（本地 local_open / 公网 public_https）；
      # 严格托管部署可设为 allowlist（配合 STUDY_AI_ALLOWED_HOSTS 与管理页白名单）。
      STUDY_AI_URL_POLICY: "${STUDY_AI_URL_POLICY:-}"
      STUDY_WORKER_CONCURRENCY: "${STUDY_WORKER_CONCURRENCY:-8}"
      STUDY_WORKER_JOB_TIMEOUT: "${STUDY_WORKER_JOB_TIMEOUT:-1800}"
    volumes: &app_volumes
      - zhixu_data:/data
      - "${HOST_BANK_DIR:-../../高考题库_按学科}:/bank:ro"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    image: zhixu-app:local
    restart: unless-stopped
    command: ["arq", "deploy.worker.WorkerSettings"]
    healthcheck:
      disable: true
    environment: *app_env
    volumes: *app_volumes
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhixu
      POSTGRES_USER: zhixu
      POSTGRES_PASSWORD: "${PG_PASSWORD:?请设置 PG_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhixu -d zhixu -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./pg_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 强制密码认证且不允许示例回退：Redis 只应被 Web/Worker 访问，
    # 公网部署必须显式设置 REDIS_PASSWORD（缺失时 Compose 拒绝启动）。
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD（禁止 changeme 等示例值）}"]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?请设置 REDIS_PASSWORD（禁止 changeme 等示例值）}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STUDY_DOMAIN: "${STUDY_DOMAIN:-localhost}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  zhixu_data:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
