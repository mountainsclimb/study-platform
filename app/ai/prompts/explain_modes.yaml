version: "study-2026-11-20-v2"

modes:
  detailed:
    name: "详细解析"
    short: "题意 → 思路 → 步骤 → 答案 → 易错点"
    prompt: |
      请以【详细解析】模式为学生讲解本题，严格按以下 Markdown 分节组织（数学公式用 $...$ 或 $$...$$）：
      ## 1. 题意与条件梳理
      提取已知条件、隐含条件与设问目标；若信息或题图缺失请先明确指出。
      ## 2. 解题思路
      说明切入点与核心转化方向。
      ## 3. 分步解答
      给出清晰、可核查的逐步推导。
      ## 4. 最终结论
      明确给出本题答案（原卷答案仅作参考，若发现疑点需说明但不得篡改来源）。
      ## 5. 易错点提醒
      列出 1–3 个最容易踩坑的地方及规避方法。

  standard_steps:
    name: "标准步骤（大题）"
    short: "得分点拆解 · 分值建议 · 规范书写模板"
    prompt: |
      请以【标准步骤（大题得分模板）】模式讲解本题，严格按以下 Markdown 分节输出：
      ## 1. 采分点与分值建议
      用表格或列表拆解每个得分点，格式：`| 步骤 | 关键表达式/结论 | 建议分值 | 评分要求 |`（明确注明分值建议为 AI 参考，非官方细则）。
      ## 2. 考场规范书写模板
      给出可直接参照的“解 / 证明”完整规范书写过程，标出每一处【得分点】。
      ## 3. 常见扣分细节
      说明跳步、单位、定义域/范围、答语遗漏等典型扣分原因。

  pattern_teaching:
    name: "题型教学"
    short: "识别特征 → 通用解法框架 → 本题示范 → 常见变形"
    prompt: |
      请以【题型教学】模式帮学生掌握这一类题的通法，严格按以下 Markdown 分节输出：
      ## 1. 题型识别特征
      看到哪些关键词、结构或图像特征时，应立刻联想到这类题型。
      ## 2. 通用解法框架（3–5 步）
      提炼可迁移的固定操作流程，每步说明“做什么 + 为什么”。
      ## 3. 本题套用示范
      按上述框架逐一对应演示本题求解过程。
      ## 4. 常见变形与应对
      总结 2–3 种常见改法（改条件、改设问、反过来考）及微调策略。

  extension:
    name: "知识拓展"
    short: "核心知识点 → 拓展结论 → 跨章节联系（标注拓展）"
    prompt: |
      请以【知识拓展】模式进行培优拓展，严格按以下 Markdown 分节输出：
      ## 1. 本题核心知识点
      列出本题直接考查的课标知识点与方法。
      ## 2. 拓展结论与二级结论（拓展、非本题必需）
      明确标注【拓展、非本题必需】，给出相关高频二级结论、推广形式及严格适用条件。
      ## 3. 跨章节知识联系（拓展、非本题必需）
      说明本题思想如何与其他章节（如数形结合、函数与方程、能量与动量等）打通。

  hints:
    name: "启发引导"
    short: "分层提示 1/2/3，不直接给答案"
    prompt: |
      请以【启发引导】模式辅导学生自主思考，**绝对不要直接给出最终答案或完整步骤**。
      请严格输出 3 层渐进提示，每层用 `<details><summary>提示 X：...</summary>...</details>` 包裹：
      - 提示 1（方向提示）：只点出审题突破口与涉及的知识点。
      - 提示 2（关键转化）：点出最核心的公式、辅助线或关键变形，但保留计算。
      - 提示 3（临门一脚）：给出接近结论的最后一步检查要点，依然不直接写出最终选项或数值答案。

  variants:
    name: "变式练习"
    short: "2 道同知识点变式题（答案默认折叠）"
    prompt: |
      请以【变式练习】模式生成 **2 道** 与本题同知识点、难度梯度递进的变式练习题：
      - 变式 1（巩固同类）：保留核心方法，更换情境或数值。
      - 变式 2（进阶迁移）：略微增加条件变化或综合度。
      每道变式题先完整给出题干（选择题给 A/B/C/D 选项），然后把答案和简要解析严格折叠在：
      `<details><summary>点击核对变式 X 参考答案与解析（请先独立作答）</summary>...</details>` 中。
      注明：变式题为 AI 生成练习，非高考原题。
